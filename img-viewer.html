<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radiocom | Prohlížeč IMG</title>
  <meta name="description" content="Lokální prohlížeč frekvencí z konfiguračních IMG souborů radiostanic.">
  <meta name="theme-color" content="#121821">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/private.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="index.html" aria-label="Radiocom domů"><span class="brand-mark" aria-hidden="true"></span><span class="brand-txt">Radiocom</span></a>
      <nav class="nav nav-static" aria-label="Hlavní navigace">
        <a href="index.html#kanaly">Kanály</a>
        <a href="images.html">Soubory</a>
        <a href="print.html">Tisk</a>
      </nav>
    </div>
  </header>
  <main class="private-main">
    <div class="wrap">
      <header class="private-header">
        <p class="kicker">Nástroj</p>
        <h1>Prohlížeč IMG</h1>
        <p>Soubor se zpracuje pouze v tomto prohlížeči a nikam se nenahrává.</p>
      </header>
      <section class="img-dropzone panel" data-img-dropzone>
        <label for="img-file"><strong>Vyberte IMG soubor</strong> nebo ho sem přetáhněte</label>
        <input id="img-file" type="file" accept=".img,application/octet-stream" data-img-input>
        <p class="img-status" data-img-status>Podporované jsou obrazy s frekvencemi uloženými jako 32bitová hodnota v Hz.</p>
      </section>
      <section class="img-result panel" data-img-result hidden>
        <div class="release-heading">
          <div><p class="kicker">Dekódovaný obsah</p><h2 data-img-title></h2></div>
          <span class="release-count" data-img-meta></span>
        </div>
        <div class="release-table-wrap">
          <table class="release-table">
            <thead><tr><th>Kanál</th><th>Frekvence</th><th>Hodnota v obrazu</th></tr></thead>
            <tbody data-img-rows></tbody>
          </table>
        </div>
      </section>
      <div class="private-actions"><a class="private-back" href="images.html">Zpět na soubory</a></div>
    </div>
  </main>
  <script src="assets/js/img-viewer.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
