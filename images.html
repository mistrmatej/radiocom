<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radiokom | Images</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/private.css">
</head>
<body>
  <main class="private-main">
    <div class="wrap">
      <header class="private-header">
        <p class="kicker">Soubory</p>
        <h1>Images</h1>
        <p>Programovací soubory pro radiostanice, které používám.</p>
      </header>

      <section class="release-list" data-release-list aria-label="Soubory radiostanic">
        <article class="radio-download-card panel accent-blue" data-radio-id="uv-5rm">
          <div class="radio-download-body">
            <div class="release-heading">
              <div>
                <p class="kicker">Radiostanice 01</p>
                <h2>Baofeng UV-5RM</h2>
              </div>
              <span class="release-count" data-release-count>Načítám…</span>
            </div>
            <div class="release-table-wrap">
              <table class="release-table">
                <thead>
                  <tr><th>Soubor</th><th>Typ</th><th>Velikost</th><th></th></tr>
                </thead>
                <tbody data-release-files></tbody>
              </table>
            </div>
          </div>
        </article>

        <article class="radio-download-card panel accent-purple" data-radio-id="bf-v8a">
          <div class="radio-download-body">
            <div class="release-heading">
              <div>
                <p class="kicker">Radiostanice 02</p>
                <h2>Baofeng BF-V8A</h2>
              </div>
              <span class="release-count" data-release-count>Načítám…</span>
            </div>
            <div class="release-table-wrap">
              <table class="release-table">
                <thead>
                  <tr><th>Soubor</th><th>Typ</th><th>Velikost</th><th></th></tr>
                </thead>
                <tbody data-release-files></tbody>
              </table>
            </div>
          </div>
        </article>
      </section>

      <div class="private-actions">
        <a class="private-back" href="index.html">Zpět na přehled</a>
      </div>
    </div>
  </main>
  <script src="assets/js/downloads-data.js"></script>
  <script src="assets/js/downloads.js"></script>
</body>
</html>
